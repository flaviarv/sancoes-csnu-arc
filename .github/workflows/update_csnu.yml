name: Atualização Automática da Lista CSNU e Build do Frontend

on:
  schedule:
    # Executa diariamente às 04:00 UTC (01:00 horário de Brasília)
    - cron: '0 4 * * *'
  push:
    paths:
      - 'frontend/**'
  # Permite executar manualmente pelo painel do GitHub na aba "Actions"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-csnu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências Python
        run: |
          pip install pandas pyarrow

      - name: Executar ETL da Lista CSNU
        run: |
          python scripts/etl_csnu.py

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compilar Frontend (Bun + Vite)
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run build
          cd ..
          cp -r frontend/dist/* public/
          cp -r frontend/dist/* static/

      - name: Commit e Push se houver alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add csnu_list.parquet public/ static/
          
          if git diff --staged --quiet; then
            echo "Nenhuma alteração encontrada."
          else
            echo "Alterações detectadas! Enviando commit..."
            git commit -m "chore: atualiza lista CSNU e compila frontend automaticamente"
            git push
          fi
